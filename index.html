<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Giải Mã Bí Mật</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #1a1a2e; color: #fff; }
        .container { max-width: 600px; margin: auto; background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #0f3460; }
        textarea { width: 100%; height: 120px; margin-bottom: 20px; padding: 15px; border: 1px solid #0f3460; border-radius: 8px; background: #0f3460; color: #e94560; font-size: 16px; box-sizing: border-box; }
        button { background: #e94560; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 18px; transition: 0.3s; }
        button:hover { background: #ff2e63; box-shadow: 0 0 15px #e94560; }
        .result-box { margin-top: 25px; padding: 20px; background: #1a1a2e; border-radius: 8px; border-left: 5px solid #e94560; min-height: 50px; }
        .label { margin-bottom: 10px; display: block; color: #95adbe; }
        #decodedText { color: #4eeaff; font-weight: bold; font-size: 20px; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; color: #e94560;">MÁY GIẢI MÃ TÀNG HÌNH</h2>
    
    <span class="label">Dán văn bản nghi vấn vào đây:</span>
    <textarea id="encodedInput" placeholder="Dán đoạn văn bản có chứa mã ẩn tại đây..."></textarea>
    
    <button onclick="decodeText()">GIẢI MÃ NGAY</button>

    <div class="result-box">
        <span class="label">Nội dung ẩn tìm thấy:</span>
        <div id="decodedText">Chưa có dữ liệu...</div>
    </div>
</div>

<script>
    function decodeText() {
        const input = document.getElementById('encodedInput').value;
        
        // Các ký tự tàng hình dùng để mã hóa
        const zero = "\u200B";
        const one = "\u200C";
        const gap = "\u200D";

        // Lọc lấy các ký tự tàng hình và chuyển về dãy nhị phân
        let binaryString = "";
        for (let char of input) {
            if (char === zero) binaryString += "0";
            else if (char === one) binaryString += "1";
            else if (char === gap) binaryString += " ";
        }

        if (binaryString.trim() === "") {
            document.getElementById('decodedText').innerText = "Không tìm thấy thông điệp ẩn nào!";
            return;
        }

        // Chuyển từ nhị phân sang văn bản (Unicode)
        try {
            const words = binaryString.trim().split(' ');
            const decoded = words.map(bin => {
                return String.fromCharCode(parseInt(bin, 2));
            }).join('');
            
            document.getElementById('decodedText').innerText = decoded;
        } catch (e) {
            document.getElementById('decodedText').innerText = "Lỗi dữ liệu: Mã ẩn không đúng định dạng.";
        }
    }
</script>

</body>
</html>
